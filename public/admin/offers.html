<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers Management — Ranchi Pathology Admin</title>
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-sidebar-backdrop" id="admin-sidebar-backdrop"></div>
    <div class="admin-main">
      <header class="admin-header" id="admin-header"></header>
      <main class="admin-content">
        <div class="admin-toolbar">
          <div class="tabs" id="offer-tabs">
            <button type="button" class="tab-btn active" data-filter="all">All Offers</button>
            <button type="button" class="tab-btn" data-filter="active">Active</button>
            <button type="button" class="tab-btn" data-filter="inactive">Inactive</button>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="add-offer-btn">Create Offer</button>
        </div>

        <div class="admin-table-card">
          <div class="admin-table-header">
            <h2 class="admin-table-title">Promo Codes &amp; Offers <span id="offers-count" class="badge badge-blue" style="margin-left:8px">0</span></h2>
          </div>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Title</th>
                  <th>Discount</th>
                  <th>Min / Max</th>
                  <th>Validity</th>
                  <th>Usage</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="offers-tbody">
                <tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--muted)">Loading offers...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="mobile-cards-list" id="offers-cards"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Offer Modal -->
  <div class="modal-overlay" id="offer-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="offer-modal-title">Create Offer</h3>
        <button class="modal-close" data-close-modal="offer-modal">&times;</button>
      </div>
      <form id="offer-form">
        <div class="modal-body">
          <input type="hidden" id="o-id">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="o-code">Coupon Code *</label>
              <input type="text" id="o-code" class="form-input" placeholder="e.g. WELCOME10" style="text-transform:uppercase" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="o-title">Offer Title *</label>
              <input type="text" id="o-title" class="form-input" placeholder="e.g. Welcome Discount" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="o-desc">Description</label>
            <textarea id="o-desc" class="form-input" placeholder="Offer terms or summary..."></textarea>
          </div>
          <div class="form-grid-3">
            <div class="form-group">
              <label class="form-label" for="o-type">Discount Type *</label>
              <select id="o-type" class="form-input">
                <option value="percentage">Percentage (%)</option>
                <option value="flat">Fixed Amount (₹)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="o-value">Discount Value *</label>
              <input type="number" id="o-value" class="form-input" min="0" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="o-scope">Applicable Scope</label>
              <select id="o-scope" class="form-input">
                <option value="all">All Tests &amp; Packages</option>
                <option value="tests">Tests Only</option>
                <option value="packages">Packages Only</option>
              </select>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="o-min">Minimum Order Amount (₹)</label>
              <input type="number" id="o-min" class="form-input" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="o-max">Max Discount Cap (₹)</label>
              <input type="number" id="o-max" class="form-input" min="0" placeholder="Optional">
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="o-valid-from">Valid From *</label>
              <input type="date" id="o-valid-from" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="o-valid-until">Valid Until *</label>
              <input type="date" id="o-valid-until" class="form-input" required>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="o-total-limit">Total Usage Limit</label>
              <input type="number" id="o-total-limit" class="form-input" min="1" placeholder="Unlimited if empty">
            </div>
            <div class="form-group">
              <label class="form-label" for="o-per-cust">Per Customer Limit</label>
              <input type="number" id="o-per-cust" class="form-input" min="1" value="1">
            </div>
          </div>
          <label class="switch-label">
            <input type="checkbox" id="o-active" class="switch-input" checked>
            <span>Offer Active</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="offer-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="o-submit-btn">Save Offer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin/admin-common.js"></script>
  <script>
    (() => {
      let offers = [];
      let filterMode = 'all';

      async function loadOffers() {
        try {
          const res = await API.get('/admin/offers');
          offers = AdminCommon.unwrapList(res, ['offers', 'data', 'items']);
          renderOffers();
        } catch (err) {
          UI.toast(err.message || 'Failed to load offers', 'error');
        }
      }

      function renderOffers() {
        const list = offers.filter(o => {
          if (filterMode === 'active') return !!o.is_active;
          if (filterMode === 'inactive') return !o.is_active;
          return true;
        });

        document.getElementById('offers-count').textContent = String(list.length);
        const tbody = document.getElementById('offers-tbody');
        const cards = document.getElementById('offers-cards');

        if (!list.length) {
          const empty = AdminCommon.emptyStateHTML('tag', 'No offers found', 'Create a promotional coupon code for patients.');
          tbody.innerHTML = `<tr><td colspan="8">${empty}</td></tr>`;
          cards.innerHTML = empty;
          return;
        }

        const fmtDisc = (o) => o.discount_type === 'percentage'
          ? `${o.discount_value}% OFF`
          : `${UI.formatCurrency(o.discount_value)} OFF`;

        tbody.innerHTML = list.map(o => `
          <tr>
            <td><span class="badge badge-blue" style="font-family:monospace;font-size:var(--fs-sm)">${UI.escapeHtml(o.code)}</span></td>
            <td>
              <div style="font-weight:600">${UI.escapeHtml(o.title)}</div>
              <div style="font-size:var(--fs-xs);color:var(--muted)">Scope: ${UI.escapeHtml(o.applicable_to || 'all')}</div>
            </td>
            <td><strong>${fmtDisc(o)}</strong></td>
            <td>
              <div>Min: ${UI.formatCurrency(o.min_order_amount || 0)}</div>
              <div style="font-size:var(--fs-xs);color:var(--muted)">Max: ${o.max_discount_amount ? UI.formatCurrency(o.max_discount_amount) : 'No cap'}</div>
            </td>
            <td style="font-size:var(--fs-xs)">
              ${UI.formatDate(o.valid_from)}<br>to ${UI.formatDate(o.valid_until)}
            </td>
            <td>${o.times_used || 0} / ${o.total_usage_limit || '∞'}</td>
            <td><span class="badge ${o.is_active ? 'badge-green' : 'badge-gray'}">${o.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
              <div class="action-btns">
                <button class="icon-btn edit-offer-btn" data-id="${o.id}" title="Edit">${Components.icon('edit')}</button>
                <button class="btn btn-sm ${o.is_active ? 'btn-secondary' : 'btn-success'} toggle-offer-btn" data-id="${o.id}">
                  ${o.is_active ? 'Deactivate' : 'Activate'}
                </button>
              </div>
            </td>
          </tr>
        `).join('');

        cards.innerHTML = list.map(o => `
          <div class="data-card">
            <div class="data-card-header">
              <div>
                <div class="data-card-title">${UI.escapeHtml(o.code)} · ${UI.escapeHtml(o.title)}</div>
                <div style="font-size:var(--fs-xs);color:var(--muted)">${fmtDisc(o)} · Scope: ${UI.escapeHtml(o.applicable_to || 'all')}</div>
              </div>
              <span class="badge ${o.is_active ? 'badge-green' : 'badge-gray'}">${o.is_active ? 'Active' : 'Inactive'}</span>
            </div>
            <div class="data-card-meta">
              <div>Min Order<strong>${UI.formatCurrency(o.min_order_amount || 0)}</strong></div>
              <div>Usage<strong>${o.times_used || 0} / ${o.total_usage_limit || '∞'}</strong></div>
              <div>From<strong>${UI.formatDate(o.valid_from)}</strong></div>
              <div>Until<strong>${UI.formatDate(o.valid_until)}</strong></div>
            </div>
            <div class="data-card-actions">
              <button class="btn btn-secondary btn-sm edit-offer-btn" data-id="${o.id}">Edit</button>
              <button class="btn btn-sm ${o.is_active ? 'btn-danger' : 'btn-success'} toggle-offer-btn" data-id="${o.id}">
                ${o.is_active ? 'Deactivate' : 'Activate'}
              </button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.edit-offer-btn').forEach(btn => {
          btn.addEventListener('click', () => openOfferModal(btn.dataset.id));
        });
        document.querySelectorAll('.toggle-offer-btn').forEach(btn => {
          btn.addEventListener('click', () => toggleOffer(btn.dataset.id, btn));
        });
      }

      function openOfferModal(id = null) {
        document.getElementById('offer-form').reset();
        document.getElementById('o-id').value = id || '';
        document.getElementById('offer-modal-title').textContent = id ? 'Edit Offer' : 'Create Offer';

        const o = id ? offers.find(x => String(x.id) === String(id)) : null;
        if (o) {
          document.getElementById('o-code').value = o.code || '';
          document.getElementById('o-title').value = o.title || '';
          document.getElementById('o-desc').value = o.description || '';
          document.getElementById('o-type').value = o.discount_type === 'flat' || o.discount_type === 'fixed' ? 'flat' : 'percentage';
          document.getElementById('o-value').value = o.discount_value ?? '';
          document.getElementById('o-scope').value = o.applicable_to || 'all';
          document.getElementById('o-min').value = o.min_order_amount ?? 0;
          document.getElementById('o-max').value = o.max_discount_amount ?? '';
          document.getElementById('o-valid-from').value = (o.valid_from || '').slice(0, 10);
          document.getElementById('o-valid-until').value = (o.valid_until || '').slice(0, 10);
          document.getElementById('o-total-limit').value = o.total_usage_limit ?? '';
          document.getElementById('o-per-cust').value = o.per_customer_limit ?? 1;
          document.getElementById('o-active').checked = !!o.is_active;
        } else {
          const today = new Date().toISOString().slice(0, 10);
          const nextMonth = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
          document.getElementById('o-valid-from').value = today;
          document.getElementById('o-valid-until').value = nextMonth;
          document.getElementById('o-active').checked = true;
        }
        UI.openModal('offer-modal');
      }

      function toggleOffer(id, btn) {
        const o = offers.find(x => String(x.id) === String(id));
        if (!o) return;
        const nextActive = o.is_active ? 0 : 1;
        UI.confirm(`${nextActive ? 'Activate' : 'Deactivate'} coupon "${o.code}"?`, async () => {
          UI.setButtonLoading(btn, true);
          try {
            await API.put(`/admin/offers/${id}`, { ...o, is_active: nextActive });
            UI.toast('Offer updated', 'success');
            await loadOffers();
          } catch (err) {
            UI.toast(err.message || 'Failed to update offer', 'error');
          } finally {
            UI.setButtonLoading(btn, false);
          }
        }, 'Update Offer');
      }

      document.addEventListener('DOMContentLoaded', async () => {
        await AdminCommon.init({
          page: 'offers',
          title: 'Offers Management',
          subtitle: 'Manage discount coupons, validity windows, and usage limits',
        });

        await loadOffers();

        document.querySelectorAll('#offer-tabs .tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#offer-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMode = btn.dataset.filter;
            renderOffers();
          });
        });

        document.getElementById('add-offer-btn').addEventListener('click', () => openOfferModal(null));

        document.getElementById('offer-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = document.getElementById('o-id').value;
          const maxVal = document.getElementById('o-max').value;
          const totalLimit = document.getElementById('o-total-limit').value;

          const payload = {
            code: document.getElementById('o-code').value.trim().toUpperCase(),
            title: document.getElementById('o-title').value.trim(),
            description: document.getElementById('o-desc').value.trim(),
            discount_type: document.getElementById('o-type').value,
            discount_value: Number(document.getElementById('o-value').value),
            applicable_to: document.getElementById('o-scope').value,
            min_order_amount: Number(document.getElementById('o-min').value || 0),
            max_discount_amount: maxVal !== '' ? Number(maxVal) : null,
            valid_from: document.getElementById('o-valid-from').value,
            valid_until: document.getElementById('o-valid-until').value,
            total_usage_limit: totalLimit !== '' ? Number(totalLimit) : null,
            per_customer_limit: Number(document.getElementById('o-per-cust').value || 1),
            is_active: document.getElementById('o-active').checked ? 1 : 0,
          };

          const btn = document.getElementById('o-submit-btn');
          UI.setButtonLoading(btn, true);
          try {
            if (id) {
              await API.put(`/admin/offers/${id}`, payload);
              UI.toast('Offer updated', 'success');
            } else {
              await API.post('/admin/offers', payload);
              UI.toast('Offer created', 'success');
            }
            UI.closeModal('offer-modal');
            await loadOffers();
          } catch (err) {
            UI.toast(err.message || 'Failed to save offer', 'error');
          } finally {
            UI.setButtonLoading(btn, false);
          }
        });
      });
    })();
  </script>
</body>
</html>
